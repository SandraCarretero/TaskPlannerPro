<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <title>Flowtask - Chat</title>

    <link rel="shortcut icon" href="../img/icon.svg" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/chat.css" />
    <script defer type="module" src="../js/chat.js"></script>
  </head>
  <body>
    <div class="main-content">
      <div class="sidebar">
        <a class="hidden-mobile">
          <div class="logo">
            <img src="../img/icon.svg" alt="" class="logo-img" />
            <span>Flowtask</span>
          </div>
        </a>
        <a href="../index.html">
          <div class="nav-item">
            <i class="fas fa-tasks"></i>
            <span class="hidden-mobile">Tareas</span>
          </div>
        </a>
        <a href="events.html">
          <div class="nav-item">
            <i class="fas fa-calendar-check"></i>
            <span class="hidden-mobile">Eventos</span>
          </div>
        </a>

        <div id="addTaskMenu" class="nav-item nav-plus hidden-desktop">
          <i class="fa-solid fa-plus"></i>
        </div>
        <a href="chat.html">
          <div class="nav-item active">
            <i class="fas fa-comment"></i>
            <span class="hidden-mobile">Chat</span>
          </div>
        </a>
        <a href="profile.html">
          <div class="nav-item">
            <i class="fas fa-user"></i>
            <span class="hidden-mobile">Perfil</span>
          </div>
        </a>
      </div>
      <div class="main-area">
        <div class="tasks-area-header">
          <div class="logo hidden-desktop">
            <img src="../img/icon.svg" alt="" class="logo-img" />
            <span>Flowtask</span>
          </div>
          <h1 id="title" class="title">Chat</h1>
          
          <div class="info">
            <div class="info-card weather-card">
              <div class="weather-temp">
                <img src="" alt="" id="weather-icon" class="weather-icon" />
                <span id="weather-temp">°C</span>
              </div>
            </div>
            <a href="profile.html">
              <div class="profile">
                <div id="avatar" class="avatar"></div>
              </div>
            </a>
          </div>
        </div>

        <div class="chat-container">
          <div class="chat-sidebar">
            <div class="chat-search">
              <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar..." id="chat-search" />
              </div>
            </div>
            
            <div class="chat-tabs">
              <div class="chat-tab active" data-tab="conversations">Conversaciones</div>
              <div class="chat-tab" data-tab="users">Usuarios</div>
            </div>
            
            <div class="chat-tab-content active" id="conversations-tab">
              <div id="conversations-container"></div>
            </div>
            
            <div class="chat-tab-content" id="users-tab">
              <div id="users-container"></div>
            </div>
          </div>

          <div class="chat-main">
            <div class="chat-header" id="chat-header">
              <!-- El encabezado se cargará dinámicamente -->
            </div>

            <div class="chat-messages" id="chat-messages">
              <!-- Mensajes se cargarán dinámicamente -->
            </div>

            <div
              id="typing-indicator"
              class="typing-indicator"
              style="display: none"
            >
              <!-- Indicador de escritura -->
            </div>

            <div class="chat-input-container">
              <button class="chat-attach-btn">
                <i class="fas fa-paperclip"></i>
              </button>
              <div class="chat-input-wrapper">
                <input
                  type="text"
                  id="message-input"
                  placeholder="Escribe un mensaje..."
                  class="chat-input"
                />
                <button class="chat-emoji-btn">
                  <i class="far fa-smile"></i>
                </button>
              </div>
              <button class="chat-send-btn" id="send-message">
                <i class="fas fa-paper-plane"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
